# CICD Template — local control plane (docker compose) — minimal
# รันแค่ Jenkins + OpenBao ; ใช้ GitHub เป็น repo (ไม่ต้องมี git server ในเครื่อง)
# ส่วน ArgoCD/k8s ดู compose/README.md (ใช้ k3d เพราะ ArgoCD ต้องการ Kubernetes)
#
# ใช้งาน:  cd compose && docker compose up -d
# ปิด:     docker compose down          (เพิ่ม -v ถ้าอยากลบ volume ด้วย)

name: cicd-template

services:
  # ---- OpenBao (dev mode) : secret store ----
  openbao:
    image: ghcr.io/openbao/openbao:2.6.1
    container_name: openbao
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_ADDR: http://0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports:
      - "18200:8200"  # UI/API:  http://localhost:18200  (token: root)
    restart: unless-stopped

  # ---- Jenkins : CI (trigger + build) ----
  # mount docker socket ไว้เผื่ออยาก build image ทีหลัง (ตอนนี้ยังไม่ต้อง)
  jenkins:
    build: ./jenkins          # jenkins/jenkins:lts-jdk17 + Trivy CLI (ดู jenkins/Dockerfile)
    image: cicd-template-jenkins:lts-jdk17
    container_name: jenkins
    user: root                                  # ให้เข้าถึง docker socket ได้
    environment:
      JENKINS_OPTS: "--prefix=/"
    ports:
      - "9090:8080"      # UI:  http://localhost:9090 
      - "50001:50000"    # agent 
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # เผื่อ build image ผ่าน host docker
      # Global Pipeline Library 'cicd-template' ลงทะเบียนเองที่ GUI:
      #   Manage Jenkins → System → Global Pipeline Libraries → Add
      #   Name=cicd-template, Default version=main, Modern SCM → Git → repo URL
    restart: unless-stopped

  # ---- SonarQube : code quality / SAST (H2 ในตัว — eval only, พอสำหรับ local demo) ----
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"   # ให้ start ได้บน Docker Desktop โดยไม่ต้องแก้ vm.max_map_count
    ports:
      - "19000:9000"     # UI:  http://localhost:19000  (host 9000 กันชน/WinNAT)
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  # ---- OpenSearch : เก็บ+ค้น log กลาง (single-node, security off — local เท่านั้น) ----
  # discovery.type=single-node → ข้าม bootstrap check (ไม่ต้องแก้ vm.max_map_count บน host)
  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"           # ไม่มี auth, http ธรรมดา (local เท่านั้น)
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"  # heap เล็ก กัน OOM บนเครื่องจำกัด
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    ports:
      - "19200:9200"     # API:  http://localhost:19200  (host 9200 remap กัน WinNAT)
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  # ---- OpenSearch Dashboards : หน้าเว็บค้น log (fork ของ Kibana) ----
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"   # match กับ opensearch (ไม่มี auth)
    ports:
      - "15601:5601"     # UI:  http://localhost:15601
    depends_on: [opensearch]
    restart: unless-stopped

  # ---- Fluent Bit : เก็บ log ทุก container ส่งเข้า OpenSearch (ดู fluent-bit/fluent-bit.conf) ----
  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    container_name: fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro   # json log ของทุก container
    depends_on: [opensearch]
    restart: unless-stopped

volumes:
  jenkins_home:
  opensearch_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
