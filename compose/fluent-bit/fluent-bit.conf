# Fluent Bit — อ่าน log ทุก container ในเครื่อง แล้วส่งเข้า OpenSearch
# mount /var/lib/docker/containers (json log ของ docker) เข้ามาแบบ read-only
# ดู service fluent-bit ใน compose/docker-compose.yml

[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf         # ไฟล์ default ในตัว image (มี parser 'docker')

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker           # แกะ {"log":..,"stream":..,"time":..}
    Tag               docker.*
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[OUTPUT]
    Name                opensearch
    Match               *
    Host                opensearch      # ชื่อ service ใน compose network
    Port                9200
    Logstash_Format     On              # → index ชื่อ logs-YYYY.MM.DD
    Logstash_Prefix     logs
    Suppress_Type_Name  On              # OpenSearch 2.x ไม่มี _type แล้ว
    Replace_Dots        On
    Retry_Limit         False
