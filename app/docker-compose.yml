# app/docker-compose.yml — ใช้ทั้ง local dev และ deploy on-prem (ไฟล์เดียว)
# local:  cd app && docker compose up --build  → http://localhost:18080
# deploy: Jenkins stage 'Deploy' รันไฟล์นี้บน host เดียวกัน โดย env มาจาก OpenBao (withOpenBao)
# ponytail: Jenkins กับแอปอยู่ host เดียวกัน — แยก server เมื่อไหร่ ตั้ง DOCKER_HOST=ssh://user@server ใน stage Deploy
services:
  fe:
    build: ./fe
    ports: ['18080:80'] # /api/* → nginx proxy ไป be  (host 8080 มักชน → ใช้ 18080)
    depends_on: [be]
    restart: unless-stopped
  be:
    build: ./be
    restart: unless-stopped
    environment:
      GREETING: ${GREETING:-hello from local compose} # deploy: Jenkins ส่งค่าจาก OpenBao มาเป็น env
