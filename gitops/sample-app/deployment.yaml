apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: sample-app }
  template:
    metadata:
      labels: { app: sample-app }
    spec:
      containers:
        - name: sample-app
          image: nginx:1.27-alpine    # <-- บรรทัดนี้ถูก bump-image.sh แก้อัตโนมัติตอน CI
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: sample-app-secrets   # secret ที่ ESO ดึงมาจาก OpenBao
