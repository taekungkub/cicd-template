# ดึง secret จาก OpenBao (secret/sample-app) มาสร้างเป็น k8s Secret ชื่อ sample-app-secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sample-app-secrets
  namespace: sample-app
spec:
  refreshInterval: 1m            # เช็ค OpenBao ทุก 1 นาที ถ้าเปลี่ยนจะ sync ให้
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: sample-app-secrets     # ชื่อ k8s Secret ที่จะถูกสร้าง (app เอาไปใช้)
  data:
    - secretKey: db_password     # key ใน k8s Secret
      remoteRef:
        key: sample-app          # path ใน OpenBao: secret/sample-app
        property: db_password    # field
