# เชื่อม ESO -> OpenBao ด้วย Kubernetes auth
# ต้อง apply หลังจากรัน scripts/openbao-setup.sh (สร้าง role + policy + SA แล้ว)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-sample-app          # SA ที่ ESO ใช้ auth เข้า OpenBao
  namespace: sample-app
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao
  namespace: sample-app
spec:
  provider:
    vault:                       # OpenBao พูดภาษา Vault API ได้ ใช้ provider นี้
      server: "http://openbao.openbao.svc:8200"
      path: "secret"             # KV v2 mount
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "sample-app"     # role ที่สร้างใน openbao-setup.sh
          serviceAccountRef:
            name: eso-sample-app
